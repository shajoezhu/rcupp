# CI for the standalone rcupp repository.
#
# This package is the ROOT of its own repository: there is no matrix and no
# sibling package directory. `R CMD build .` builds the current directory and
# `R CMD check` runs on the resulting tarball.
#
# All dependencies are installed by r-lib/actions/setup-r-dependencies@v2
# (pak). pak installs the DESCRIPTION dependency set plus the Config/Needs/*
# tools into the single runner library that every step and R subprocess
# shares -- this is what fixes the "there is no package called 'pkgdown' /
# 'rmarkdown' / 'covr'" failures caused by ad-hoc install.packages() steps.
# pkgdown is a website tool, so it lives in Config/Needs/website rather than
# in Suggests: a normal R CMD check never needs it.
#
# Runners have no CUDA Toolkit: rcupp builds its CPU reference shim and any
# CUDA-only tests skip themselves. _R_CHECK_FORCE_SUGGESTS_ is disabled so
# optional Suggests are not forced.
#
# External actions: actions/checkout and the r-lib/actions helpers; vbump is
# a local composite action under .github/actions/vbump. No external CI
# template is referenced. R-based gates run with the package dir as cwd so
# lintr / spelling pick up .lintr / inst/WORDLIST.

name: Check 🛠

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  r-cmd:
    name: R CMD Check 🧬
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Build and check
        run: |
          R CMD build .
          R CMD check --no-manual rcupp_*.tar.gz

  coverage:
    name: Coverage 📔
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Measure coverage
        shell: Rscript {0}
        run: |
          cv <- covr::package_coverage(".")
          print(cv)
          cat(sprintf("Coverage: %.2f%%\n", covr::percent_coverage(cv)))

  linter:
    name: Lint 🦸
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint package
        shell: Rscript {0}
        run: |
          l <- lintr::lint_package(".")
          cat(sprintf("%d lints\n", length(l)))
          if (length(l) > 0L) { print(l); quit(status = 1L, save = "no") }

  spelling:
    name: Spell Check 🆎
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::spelling
          needs: check

      - name: Spell check package
        shell: Rscript {0}
        run: |
          w <- spelling::spell_check_package(".")
          cat(sprintf("%d flagged words\n", nrow(w)))
          if (nrow(w) > 0L) { print(w); quit(status = 1L, save = "no") }

  links:
    name: Check URLs 🌐
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::urlchecker
          needs: check

      - name: Check URLs in package
        shell: Rscript {0}
        run: |
          r <- urlchecker::url_check(".")
          cat(sprintf("%d URL findings\n", nrow(r)))
          if (nrow(r) > 0L) {
            print(r)
            # Fail only on definite breakage; redirects / timeouts are noisy
            # on shared runners, so they are reported without failing the job.
            status <- as.character(r$Status)
            fatal <- grepl(
              "[45][0-9]{2}|Error|Not Found|Could not resolve|Failed",
              status, ignore.case = TRUE
            )
            if (any(fatal)) quit(status = 1L, save = "no")
          }

  vbump:
    name: Version Bump 🤜🤛
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip vbump]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vbump
