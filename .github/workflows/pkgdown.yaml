# Build this package's pkgdown site and deploy it to THIS repository's
# GitHub Pages. One repository -> one package -> one site.
#
# Dependencies are installed by r-lib/actions/setup-r-dependencies@v2 (pak)
# with `needs: website`, which installs the DESCRIPTION deps plus pkgdown
# from `Config/Needs/website` into the single runner library shared by every
# step and R subprocess. `local::.` installs this package itself, so pkgdown
# runs with install = FALSE reusing that install. This replaces the ad-hoc
# install.packages() steps that caused "there is no package called 'pkgdown'".
# The real site URL is injected through build_site(override = ...); no
# placeholder URL is committed in _pkgdown.yml.
#
# Runners have no CUDA Toolkit: rcupp builds its CPU reference shim. Optional
# Suggests are not forced: _R_CHECK_FORCE_SUGGESTS_ is disabled to match the
# check workflow.

name: pkgdown 📚

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-deploy:
    name: Build & deploy site 🌐
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - uses: actions/configure-pages@v5

      - name: Build pkgdown site
        shell: Rscript {0}
        run: |
          owner <- Sys.getenv("GITHUB_REPOSITORY_OWNER")
          repo <- sub("^.*/", "", Sys.getenv("GITHUB_REPOSITORY"))
          pkgdown::build_site(
            ".",
            install = FALSE,
            new_process = FALSE,
            preview = FALSE,
            override = list(
              destination = "docs",
              url = sprintf("https://%s.github.io/%s/", owner, repo)
            )
          )

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
